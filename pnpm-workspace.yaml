packages:
  - 'apps/*'
  - 'packages/*'
# Scripts de postinstall aprovados um a um. pnpm bloqueia por padrao — um
# postinstall arbitrario e vetor de supply chain (RNF-029).
#   esbuild          binario nativo usado por tsx e vitest
#   msgpackr-extract aceleracao de serializacao do bullmq
#   unrs-resolver    resolvedor nativo do eslint
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.18'
  - '@expo/config-plugins@57.0.9'
  - '@expo/config@57.0.9'
  - '@expo/fingerprint@0.20.10'
  - '@expo/image-utils@0.11.5'
  - '@expo/metro-config@57.0.10'
  - '@expo/metro-file-map@57.0.2'
  - '@expo/prebuild-config@57.0.14'
  - '@expo/require-utils@57.0.5'
  - babel-preset-expo@57.0.8
  - expo-asset@57.0.14
  - expo-constants@57.0.14
  - expo-modules-autolinking@57.0.11
  - expo-modules-core@57.0.13
  - expo@57.0.16
  # Recente demais para o gate de idade — ADR-0010, runtime do assistente.
  - '@mastra/core@1.66.0'
  # NR-121: adapter Fastify + CLI do Studio, alinhados ao core 1.66.
  - '@mastra/fastify@1.5.10'
  - '@mastra/server@1.66.0'
  - 'mastra@1.30.0'

# vite entra so como engine do vitest (peer). A resolucao natural cai numa
# versao <=6.4.2, que carrega GHSA-fx2h-pf6j-xcff (alta) e mais duas moderadas.
# O gate de auditoria da CI e bloqueante em severidade alta (RNF-029), entao
# forcamos a faixa ja corrigida. O teto <8 existe porque o peer do vitest 3.2
# aceita ate a major 7.
overrides:
  vite: '>=7.3.6 <8'
  # Prende o metro-config na linha 0.86, alinhada com o react-native 0.86.2 que
  # o app usa. Sem isto o peer opcional do react-native-worklets (que vem do
  # Reanimated, exigido pelo drawer) resolve para 0.87.1 e arrasta um segundo
  # Metro, o 0.87.0, que depende de image-size <=2.0.2 — GHSA-w3rx-r6r6-pgpr e
  # GHSA-5p2g-fcmc-qvqq, ambas altas, e o gate de auditoria e bloqueante em
  # severidade alta (RNF-029). Nao da para corrigir subindo a versao: a 2.0.3
  # que o aviso pede nunca foi publicada. O pin e seguro porque o Metro que o
  # Expo executa e o 0.84.5, que nem usa o pacote — vendorizou a implementacao
  # em src/lib/imageSize.js.
  '@react-native/metro-config': '0.86.3'
  # GHSA-2883-xcg3-v3hh (alta): `maxTotalMergeKeys` nao limita CPU quando a
  # origem da mesclagem e vazia. Chega por dentro do ESLint
  # (`@eslint/eslintrc`), em 60 caminhos — e dependencia de FERRAMENTA, nao de
  # producao, mas o gate de auditoria e bloqueante em severidade alta (RNF-029)
  # e nao distingue.
  #
  # Nao veio de mudanca nossa: a 4.3.1 ja estava no lock, e o aviso foi
  # publicado depois do ultimo PR verde. Subir para a 4.3.2, que e a primeira
  # corrigida, e a saida — sem teto, porque a serie 4 nao tem quebra prevista e
  # prender aqui so adiaria o proximo aviso.
  js-yaml: '>=4.3.2'
