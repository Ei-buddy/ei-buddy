# Ambiente de desenvolvimento local.
#
#   pnpm infra:up      sobe e espera ficar saudavel
#   pnpm infra:down    para
#   pnpm infra:reset   apaga os volumes e sobe do zero
#   pnpm infra:psql    abre o psql no banco
#
# Perfis:
#   (padrao)  postgres + redis        — o minimo para rodar api e worker
#   full      + minio + mailpit       — object storage e e-mail locais
#             docker compose --profile full up -d
#
# Producao NAO usa este arquivo — ver infra/docker-compose.prod.yml (ADR-0015).

name: na-regua

services:
  postgres:
    image: postgres:17-alpine
    container_name: naregua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naregua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naregua}
      POSTGRES_DB: ${POSTGRES_DB:-naregua}
      # Acelera o boot local. NAO usar em producao.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-naregua} -d ${POSTGRES_DB:-naregua}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    command:
      # RLS depende de politicas por sessao; log de statement ajuda a depurar isolamento.
      - 'postgres'
      - '-c'
      - 'log_statement=none'
      - '-c'
      - 'max_connections=200'

  redis:
    image: redis:7-alpine
    container_name: naregua-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    command: ['redis-server', '--appendonly', 'yes']

  # --- perfil full ---------------------------------------------------------

  minio:
    image: minio/minio:latest
    container_name: naregua-minio
    profiles: ['full']
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-naregua}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-naregua123}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    command: ['server', '/data', '--console-address', ':9001']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: naregua-mailpit
    profiles: ['full']
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
  redis-data:
  minio-data:
