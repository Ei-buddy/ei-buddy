# Deploy de producao — ADR-0015 (VPS + Compose). Builda as imagens direto
# na VM (sem registry):
#
#   docker compose -f infra/docker-compose.prod.yml build
#   docker compose -f infra/docker-compose.prod.yml up -d
#
# Na pratica quem chama isto e `infra/deploy.sh` (NR-015), pelo workflow
# `deploy.yml`. Rodar a mao continua valendo — e o mesmo compose.
#
# `DEPLOY_TAG` marca as imagens com o COMMIT que as gerou, e e o que torna a
# reversao barata: voltar e `DEPLOY_TAG=<commit anterior> up -d`, sem buildar
# de novo, porque a imagem antiga continua na maquina (RNF-064, teto de 10
# min). Sem a variavel, cai em `latest` e o comportamento e o de antes.
#
# Espera um arquivo `.env.production` na raiz do repo (mesmo nivel de
# `.env.example`) com todas as variaveis de docs/engenharia/ambientes.md,
# AUTH_PROVIDER=better-auth incluido (`fake` e recusado em producao).
#
# postgres e redis NAO publicam porta no host — so o caddy fala com a
# internet, api/worker/web/postgres/redis so se enxergam pela rede interna
# do compose.

name: na-regua-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: naregua-postgres
    restart: unless-stopped
    env_file: ../.env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # WAL arquivado e os backups — NR-015. O WAL fica em volume; os backups
      # em caminho do HOST, para `infra/backup.sh` e o rclone alcancarem sem
      # entrar no container.
      - wal-archive:/wal
      - ${BACKUP_DIR:-/var/backups/na-regua}:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    command:
      - 'postgres'
      - '-c'
      - 'log_statement=none'
      - '-c'
      - 'max_connections=200'
      # Arquivamento de WAL — RNF-013 (RPO <= 15 min). Backup diario sozinho
      # daria RPO de 24 h; sao os segmentos de WAL entre um backup e outro que
      # permitem restaurar ate um ponto no tempo.
      #
      # `archive_timeout=900` forca a troca de segmento a cada 15 min mesmo com
      # o banco parado — sem isso, um dia de pouco movimento nao fecharia
      # segmento nenhum e o RPO seria o intervalo real de escrita, nao 15 min.
      # O preco e um segmento de 16 MB a cada 15 min; quem apara e o
      # `infra/backup.sh`.
      - '-c'
      - 'archive_mode=on'
      - '-c'
      - 'archive_command=test ! -f /wal/%f && cp %p /wal/%f'
      - '-c'
      - 'archive_timeout=900'

  redis:
    image: redis:7-alpine
    container_name: naregua-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    command: ['redis-server', '--appendonly', 'yes']

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: eibuddy-api:${DEPLOY_TAG:-latest}
    container_name: naregua-api
    restart: unless-stopped
    env_file: ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3333/health/live']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: eibuddy-worker:${DEPLOY_TAG:-latest}
    container_name: naregua-worker
    restart: unless-stopped
    env_file: ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: eibuddy-web:${DEPLOY_TAG:-latest}
    container_name: naregua-web
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      API_URL: http://api:3333
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: naregua-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  wal-archive:
  redis-data:
  caddy-data:
  caddy-config:
