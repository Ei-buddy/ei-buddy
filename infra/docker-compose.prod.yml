# Deploy de producao — ver DEC-009 (aberta; VPS + Compose escolhido por
# enquanto). Builda as imagens direto na VM (sem registry):
#
#   docker compose -f infra/docker-compose.prod.yml build
#   docker compose -f infra/docker-compose.prod.yml up -d
#
# Espera um arquivo `.env.production` na raiz do repo (mesmo nivel de
# `.env.example`) com todas as variaveis de docs/engenharia/ambientes.md,
# AUTH_PROVIDER=better-auth incluido (`fake` e recusado em producao).
#
# postgres e redis NAO publicam porta no host — so o caddy fala com a
# internet, api/worker/web/postgres/redis so se enxergam pela rede interna
# do compose.

name: na-regua-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: naregua-postgres
    restart: unless-stopped
    env_file: ../.env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    command:
      - 'postgres'
      - '-c'
      - 'log_statement=none'
      - '-c'
      - 'max_connections=200'

  redis:
    image: redis:7-alpine
    container_name: naregua-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    command: ['redis-server', '--appendonly', 'yes']

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: naregua-api
    restart: unless-stopped
    env_file: ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3333/health/live']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: naregua-worker
    restart: unless-stopped
    env_file: ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: naregua-web
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      API_URL: http://api:3333
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: naregua-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
