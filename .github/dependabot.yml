version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # A base e a `dev`, e nao o branch padrao do repositorio.
    #
    # Sem isto o dependabot abre contra a `main`, que e producao e so recebe
    # promocao — ela fica atras da `dev` o tempo todo, por desenho. O bump
    # nascia apontando para um lockfile que ninguem mais tem: cinco PRs
    # ficaram parados com `mergeable_state=unknown`, e mergear um deles
    # levaria para producao uma dependencia que nunca rodou na VM de teste.
    #
    # Mirando a `dev`, o bump passa pela CI, pelo deploy automatico e pela
    # promocao — o mesmo caminho de qualquer outra mudanca.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(repo)'
    groups:
      # Um PR por grupo, nao um por pacote — dependabot barulhento vira ruido
      # ignorado, e ai a atualizacao de seguranca passa despercebida.
      dev:
        dependency-type: development
        update-types: [minor, patch]
      producao:
        dependency-type: production
        update-types: [patch]
    ignore:
      # Expo e React Native so sobem junto com o SDK, nunca por dependabot
      - dependency-name: expo
      - dependency-name: react-native
      - dependency-name: 'expo-*'
      # ESLint 10 ainda nao da para adotar, e nao e escolha nossa.
      #
      # O `eslint-config-next` puxa `eslint-plugin-react`, cuja ULTIMA versao
      # publicada (7.37.5) declara `eslint: ... || ^9.7` — ela nao suporta o 10.
      # Com o 10, a regra `react/display-name` quebra em tempo de execucao:
      #
      #   TypeError: Error while loading rule 'react/display-name':
      #   contextOrFilename.getFilename is not a function
      #
      # E uma API que o ESLint 10 removeu. Nao ha versao do plugin para onde
      # subir, entao o PR do dependabot so pode ficar vermelho (foi o #116).
      #
      # Ignorar o MAJOR e nao o pacote: patch e minor do 9 continuam entrando,
      # que e onde vem correcao de seguranca. Quando o `eslint-config-next`
      # publicar uma versao com o plugin compativel, apague estas linhas.
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    # Mesmo motivo do bloco acima.
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci(repo)'
