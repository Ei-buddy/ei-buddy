name: Deploy — web

# Atalho manual, igual ao de api e pelo mesmo motivo: a web nao tem deploy
# proprio nem registry separado neste recorte — sobe no mesmo compose
# (ADR-0015). A sequencia de verdade esta em `deploy.yml`.

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente de destino
        required: true
        type: choice
        options: [staging, production]

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: ${{ inputs.ambiente }}
    secrets: inherit
