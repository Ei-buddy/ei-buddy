name: Seguranca

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Segunda, 09:00 BRT — dependencia vulneravel nao espera alguem abrir PR
    - cron: '0 12 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependencias:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vulnerabilidades conhecidas
        # RNF-029: bloqueante em severidade alta.
        #
        # Via script, e nao `pnpm audit --audit-level high` direto, porque o
        # pnpm sai com codigo 1 tanto quando ACHA vulnerabilidade quanto quando
        # nao consegue falar com o registry. As duas terminam em vermelho — nao
        # verificar nao e verificar e estar limpo — mas o motivo precisa
        # aparecer na primeira linha do log. Ver scripts/audit.mjs.
        run: node scripts/audit.mjs

  # Desativado: dependency-review-action exige GitHub Advanced Security
  # habilitado, que so existe pago para repositorio privado de organizacao
  # (desde que o repo virou privado sob a org Ei-buddy). "Auditoria de
  # dependencias" acima (pnpm audit, gratis) continua cobrindo RNF-029.
  # Reativar se/quando a org habilitar GHAS.
  #
  # revisao-de-dependencia:
  #   name: Revisao de dependencia
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/dependency-review-action@v5
  #       with:
  #         fail-on-severity: high

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        # RNF-022: nenhum segredo em codigo, log ou variavel versionada.
        #
        # Binario direto (Apache 2.0), nao a gitleaks/gitleaks-action: a
        # partir da v3 ela exige GITLEAKS_LICENSE pago pra rodar em
        # repositorio de organizacao — so passou a barrar quando o repo virou
        # privado sob a org Ei-buddy. O `detect` sem `--no-git` varre o
        # historico inteiro, igual a action fazia (por isso o `fetch-depth: 0`
        # acima).
        run: |
          set -euo pipefail
          VERSAO=8.30.1
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_checksums.txt"
          sha256sum -c <(grep "linux_x64.tar.gz" "gitleaks_${VERSAO}_checksums.txt")
          tar -xzf "gitleaks_${VERSAO}_linux_x64.tar.gz" gitleaks
          ./gitleaks detect --source . --redact -v

  # Desativado: o upload dos resultados do code scanning tambem exige GitHub
  # Advanced Security ("Advanced Security must be enabled for this
  # repository to use code scanning") — mesma parede do dependency review
  # acima, so que so aparece no fim (init passa, analyze builda e escaneia,
  # so o upload final falha). Reativar se/quando a org habilitar GHAS.
  #
  # codeql:
  #   name: CodeQL
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 20
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: github/codeql-action/init@v4
  #       with:
  #         languages: javascript-typescript
  #     - uses: github/codeql-action/analyze@v4
