name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  convencoes:
    name: Convencoes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Ler o titulo e o corpo atuais do PR
        # O payload do evento congela titulo e corpo no instante em que a
        # rodada nasceu, e o botao "Re-run" REPRODUZ esse payload. Um PR aberto
        # com o titulo autogerado do GitHub e renomeado depois ficava com o X
        # vermelho para sempre: reexecutar reavaliava o titulo antigo.
        #
        # Aconteceu no #135 — a reexecucao voltou com
        # `PR_TITLE: Feat/nr 029 baixa de titulo` depois de o titulo ja estar
        # correto. Lendo pela api aqui, "Re-run" passa a refletir a realidade.
        #
        # `|| true` no fim: se a api nao responder, os passos seguintes caem no
        # valor do evento. Barrar o PR por indisponibilidade da api seria
        # trocar um falso vermelho por outro.
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "titulo<<FIM_TITULO"
            gh pr view "$NUMERO" --repo "$GITHUB_REPOSITORY" --json title --jq .title
            echo "FIM_TITULO"
            echo "corpo<<FIM_CORPO"
            gh pr view "$NUMERO" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""'
            echo "FIM_CORPO"
          } >> "$GITHUB_OUTPUT" || true

      - name: Titulo do PR segue Conventional Commits
        # Usamos squash merge: o titulo do PR VIRA a mensagem do commit na main.
        # Por isso e ele que precisa passar, nao os commits da branch.
        env:
          PR_TITLE: ${{ steps.pr.outputs.titulo || github.event.pull_request.title }}
        run: |
          echo "Titulo avaliado: $PR_TITLE"
          echo "$PR_TITLE" | pnpm commitlint

      - name: Nome da branch segue a convencao
        # O dependabot nomeia as branches dele (dependabot/npm_and_yarn/...) e
        # nao tem como seguir o padrao. Exigir aqui tornava toda atualizacao de
        # dependencia impossivel de mesclar — inclusive as de seguranca, o
        # oposto do que a RNF-029 quer.
        #
        # A isencao olha a BRANCH, nao o ator. Com `github.actor` o check
        # dependia de quem disparou a rodada: bastava um humano editar a
        # descricao do PR para o evento vir em nome dele, a excecao nao valer e
        # o PR reprovar por um nome de branch que ninguem pode mudar. Aconteceu
        # no #11. O head_ref e propriedade do PR e nao muda conforme quem mexe.
        #
        # A PROMOCAO tambem fica de fora, pelo mesmo motivo do dependabot: o
        # nome da branch nao pode mudar. `dev` -> `main` e o fluxo que o
        # git-workflow.md descreve ("um PR de dev para main, como qualquer
        # outro"), e o padrao `<tipo>/NR-<n>-<slug>` recusava justamente ele —
        # a promocao nao podia ficar verde de jeito nenhum.
        #
        # A isencao exige as DUAS pontas. So `head_ref == dev` liberaria
        # qualquer PR saindo da dev; exigir tambem `base_ref == main` limita a
        # excecao ao caminho que de fato nao tem como ter outro nome.
        if: >-
          ${{ !startsWith(github.head_ref, 'dependabot/')
              && !(github.head_ref == 'dev' && github.base_ref == 'main') }}
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          PADRAO='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|hotfix)/NR-[0-9]+-[a-z0-9-]+$'
          if [[ ! "$BRANCH" =~ $PADRAO ]]; then
            echo "::error::Nome de branch invalido: '$BRANCH'"
            echo "Esperado: <tipo>/NR-<numero>-<slug-kebab-case>"
            echo "Exemplo:  feat/NR-042-carrinho-codigo-barras"
            echo "Ver docs/engenharia/git-workflow.md#nomenclatura"
            exit 1
          fi
          echo "Branch OK: $BRANCH"

      - name: Referencia a tarefa no titulo ou no corpo
        # Idem: atualizacao de dependencia nao sai de tarefa do ledger.
        #
        # E a promocao `dev` -> `main` tambem nao: ela nao FAZ trabalho, ela
        # leva o que ja foi feito. Exigir um NR obrigaria a escolher um dos
        # quarenta e tantos que o PR carrega, e o escolhido mentiria sobre os
        # outros. Mesma isencao do nome da branch, logo acima.
        if: >-
          ${{ !startsWith(github.head_ref, 'dependabot/')
              && !(github.head_ref == 'dev' && github.base_ref == 'main') }}
        env:
          PR_TITLE: ${{ steps.pr.outputs.titulo || github.event.pull_request.title }}
          PR_BODY: ${{ steps.pr.outputs.corpo || github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! echo "$PR_TITLE $PR_BODY $BRANCH" | grep -qE 'NR-[0-9]+'; then
            echo "::error::PR sem NR-xxx. Todo trabalho sai de uma tarefa do ledger."
            exit 1
          fi
