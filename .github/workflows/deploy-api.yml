name: Deploy — api

# Atalho manual. A sequencia de verdade esta em `deploy.yml`, que sobe api,
# worker e web juntos: e o mesmo `infra/docker-compose.prod.yml` na mesma VM
# (ADR-0015; DEC-014, tag por app, segue adiada).
#
# Sem gatilho de tag aqui — ele mora em `deploy.yml`, senao um `v*` rodaria o
# mesmo deploy duas vezes. Sem `concurrency` aqui tambem: quem serializa e o
# workflow chamado, e disputar o mesmo grupo com ele travaria os dois.

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente de destino
        required: true
        type: choice
        options: [staging, production]

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: ${{ inputs.ambiente }}
    secrets: inherit
