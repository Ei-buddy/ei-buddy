name: Deploy — api

# ESQUELETO. Nao faz deploy de nada ainda.
#
# Alvo: VPS + Compose (ADR-0015 / DEC-009). Preencher os passos e a NR-015.

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente de destino
        required: true
        type: choice
        options: [staging, production]
  push:
    tags: ['v*']

concurrency:
  group: deploy-api-${{ github.event.inputs.ambiente || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy da api
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.ambiente || 'production' }}
    steps:
      - uses: actions/checkout@v7

      - name: Bloqueado ate a NR-015
        run: |
          echo "::warning::Deploy nao configurado — NR-015 (VPS + Compose, ADR-0015)."
          echo "Quando a tarefa fechar, implementar aqui:"
          echo "  1. SSH na VPS (ou runner na maquina)"
          echo "  2. docker compose -f infra/docker-compose.prod.yml build no commit da tag"
          echo "  3. migrations com DATABASE_MIGRATION_URL"
          echo "  4. up -d com health check em /health"
          echo "  5. reversao se /health nao passar em 2 min (RNF-064)"
          exit 1
